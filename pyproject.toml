[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hlidskjalf"
version = "0.1.0"
description = "Project Hlidskjalf — edge-native sovereign AGI co-processor (Odin's high seat)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hlidskjalf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
